<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учёт посылок из Китая</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEFF3;--card:#FFFFFF;--ink:#14213D;--soft:#5B6780;--line:#D5DAE3;--acc:#D7263D;--blue:#1D4E89;--ok:#1F7A4D;--okbg:#DFF1E7;--badbg:#FBE3E6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1522;--card:#182033;--ink:#E7EBF4;--soft:#93A0BA;--line:#2B3650;--acc:#FF6B7D;--blue:#6FA3E8;--ok:#5FD19A;--okbg:#17362A;--badbg:#3D1D26}}
:root[data-theme="dark"]{--bg:#0F1522;--card:#182033;--ink:#E7EBF4;--soft:#93A0BA;--line:#2B3650;--acc:#FF6B7D;--blue:#6FA3E8;--ok:#5FD19A;--okbg:#17362A;--badbg:#3D1D26}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Manrope,system-ui,sans-serif}
.w{max-width:940px;margin:0 auto;padding:0 16px 70px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}h1{font-size:28px}h2{font-size:22px}h3{font-size:16px;margin-bottom:6px}
.m{font-family:'JetBrains Mono',ui-monospace,monospace}
.air{height:10px;background:repeating-linear-gradient(-45deg,var(--acc) 0 14px,var(--card) 14px 24px,var(--blue) 24px 38px,var(--card) 38px 48px);margin:0 -16px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:18px 0 14px}
.tot{text-align:right}.tot b{display:block;font-size:26px}.tot span{font-size:12px;color:var(--soft)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 14px;cursor:pointer;color:var(--soft);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--acc)}
.card,.st,.row{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.row{cursor:pointer}.row:hover{border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.st{margin:0;padding:12px 14px}.st .l{font-size:12px;color:var(--soft)}.st .v{font-size:19px;font-weight:600;margin-top:3px}
.ok{color:var(--ok)}.bad{color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.nums{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px;font-size:13px}.nums span{display:block;font:11px Manrope,sans-serif;color:var(--soft)}
.hint{font-size:12px;color:var(--soft)}.em{text-align:center;color:var(--soft);padding:30px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--soft)}
.chips .chip{cursor:pointer}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.ok{background:var(--okbg);border-color:var(--ok)}.chip.bad{background:var(--badbg);border-color:var(--acc)}
.back{cursor:pointer;color:var(--soft);margin-bottom:10px;display:inline-block;font-weight:600}
label{display:block;font-size:12px;color:var(--soft);margin:10px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button{font:inherit;font-weight:700;padding:8px 14px;border-radius:5px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button:hover{opacity:.85}button.g{background:none;color:var(--ink)}button.d{background:none;color:var(--acc);border-color:var(--acc)}button.s{padding:4px 9px;font-size:12px}
.g2,.g3{display:grid;gap:10px;grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:520px){.g3{grid-template-columns:1fr 1fr}}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0;border-top:1px dashed var(--line)}
.bk{background:var(--bg);border-radius:5px;padding:8px 10px;margin-top:10px;font-size:13px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:20px;width:min(500px,calc(100% - 24px))}
dialog::backdrop{background:rgba(10,15,28,.6)}.act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
</style></head><body>
<div class="w"><div class="air"></div><div id="app"></div></div><dialog id="dlg"></dialog>
<script>
const SYM={RUB:'₽',BYN:'Br',USD:'$'},ST=['Собирается','В пути','Прибыла','Выдана'],MN='янв фев мар апр май июн июл авг сен окт ноя дек'.split(' ');
const K='parcels_v4',def=()=>({cu:[],pk:[],pc:[],it:[],st:{cur:'RUB',rr:'',ro:'',dr:'',dc:'',mk:'30',bk:0}});
let D=def();try{const x=JSON.parse(localStorage.getItem(K));if(x)D={...D,...x,st:{...D.st,...x.st}}}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const ui={tab:'dash',pkg:null,fl:'all',q:''};
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const N=x=>parseFloat(String(x??'').replace(',','.'))||0,R=n=>Math.round(n*100)/100,f=n=>R(n).toLocaleString('ru-RU');
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=n=>f(n)+' '+SYM[D.st.cur],sum=(a,k)=>a.reduce((s,x)=>s+N(x[k]),0);
const cn=id=>id?(D.cu.find(c=>c.id===id)||{name:'—'}).name:'Для себя';
const opt=(a,v)=>a.map(s=>`<option ${s===v?'selected':''}>${s}</option>`).join('');
const stat=(l,v,c='')=>`<div class="st"><div class="l">${l}</div><div class="v m ${c}">${v}</div></div>`;

const today=()=>new Date().toISOString().slice(0,10);
const mig=()=>{D.pc.forEach(p=>{if(!p.pay){p.pay=N(p.paid)?[{id:uid(),d:'',a:p.paid,n:'Ранее внесено'}]:[];delete p.paid}});D.pk.forEach(k=>{if(k.dr===undefined){k.dr=D.st.dr;k.dc=D.st.dc}k.ex=k.ex||[]})};mig();
function calc(pk){
  const ps=D.pc.filter(p=>p.pkg===pk.id),W=sum(ps,'w'),real=N(pk.del)>0?N(pk.del):W*N(pk.dr),ex=sum(pk.ex||[],'a');
  const rows=ps.map(p=>{
    const its=D.it.filter(i=>i.pc===p.id),w=N(p.w),self=!p.cu,dR=real*(W?w/W:1/ps.length),cost=sum(its,'cost'),sale=self?cost:sum(its,'sale'),dC=self?dR:w*N(pk.dc);
    const base=cost+dR,total=sale+dC,paid=sum(p.pay||[],'a'),extra=self?0:Math.max(0,R(paid-total));
    return{p,its,w,self,cost,sale,dR,dC,base,total,paid,extra,profit:total+extra-base,debt:self?0:Math.max(0,R(total-paid))}});
  const t=rows.reduce((a,r)=>({base:a.base+r.base,total:a.total+r.total+r.extra,profit:a.profit+r.profit,debt:a.debt+r.debt,w:a.w+r.w,cash:a.cash+(r.self?r.base:r.paid)}),{base:0,total:0,profit:0,debt:0,w:0,cash:0});t.base+=ex;t.profit-=ex;t.cash-=t.base;t.ex=ex;t.noW=!W&&real>0;
  return{rows,t}}
const all=()=>D.pk.map(pk=>({pk,c:calc(pk)}));
const rowOf=id=>{for(const{c}of all())for(const r of c.rows)if(r.p.id===id)return r};

function chart(d){
  if(!d.length)return'<div class="em">Данные появятся, когда добавите посылки с людьми</div>';
  const W=640,H=230,L=52,B=30,T=10,cw=W-L-8,ch=H-T-B,mx=Math.max(1,...d.flatMap(x=>[x.c,x.r]))*1.1,gw=cw/d.length,bw=Math.min(28,gw*.3);let s='';
  for(let i=0;i<=4;i++){const y=T+ch-ch*i/4;s+=`<line x1="${L}" x2="${W-8}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--soft)">${f(mx*i/4)}</text>`}
  d.forEach((x,i)=>{const cx=L+gw*i+gw/2,hc=x.c/mx*ch,hr=x.r/mx*ch;
    s+=`<rect x="${cx-bw-1}" y="${T+ch-hc}" width="${bw}" height="${hc}" fill="var(--acc)" rx="2"/><rect x="${cx+1}" y="${T+ch-hr}" width="${bw}" height="${hr}" fill="var(--ok)" rx="2"/><text x="${cx}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--soft)">${E(x.l)}</text>`});
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${s}</svg><div class="hint"><b class="bad">■</b> расходы &nbsp; <b class="ok">■</b> доходы</div>`}

const pr=({pk,c})=>`<div class="row" onclick="openPk('${pk.id}')"><div class="top"><div><b style="font-size:15px">${E(pk.name)}</b><div class="hint">${pk.date||''}, ${c.rows.length} чел., ${f(c.t.w)} кг</div></div><span class="chip">${pk.status}</span></div>
<div class="nums m"><div><span>Себестоимость</span>${M(c.t.base)}</div><div><span>Клиентам</span>${M(c.t.total)}</div><div><span>Прибыль</span><b class="ok">${M(c.t.profit)}</b></div>${c.t.debt>0?`<div><span>Должны</span><b class="bad">${M(c.t.debt)}</b></div>`:''}</div></div>`;

function vDash(A){
  const t=A.reduce((a,{c})=>({p:a.p+c.t.profit,r:a.r+c.t.total,d:a.d+c.t.debt,b:a.b+c.t.base,w:a.w+c.t.w,c:a.c+c.t.cash}),{p:0,r:0,d:0,b:0,w:0,c:0});
  const mo={},deb={};
  A.forEach(({pk,c})=>{const k=(pk.date||'').slice(0,7)||'—';mo[k]=mo[k]||{c:0,r:0};mo[k].c+=c.t.base;mo[k].r+=c.t.total;c.rows.forEach(r=>{if(r.debt>0)(deb[r.p.cu]=deb[r.p.cu]||[]).push(r.debt)})});
  const md=Object.keys(mo).sort().slice(-8).map(k=>({l:k==='—'?'—':MN[+k.slice(5)-1]+' '+k.slice(2,4),...mo[k]}));
  const dl=Object.entries(deb).map(([id,a])=>[cn(id),a.reduce((x,y)=>x+y,0),a.length,id]).sort((a,b)=>b[1]-a[1]);
  const act=A.filter(x=>x.pk.status!=='Выдана').sort((a,b)=>(b.pk.date||'').localeCompare(a.pk.date||'')).slice(0,5);
  return`${bkWarn()}<div class="grid">${stat('Прибыль по расчёту',M(t.p),'ok')}${stat('Получено по факту',M(t.c),t.c<0?'bad':'ok')}${stat('Оборот',M(t.r))}${stat('Должны клиенты',M(t.d),t.d>0?'bad':'')}${stat('Маржа',t.b?f(t.p/t.b*100)+'%':'—')}${stat('В пути',A.filter(x=>x.pk.status==='В пути').length+' посылок')}${stat('Общий вес',f(t.w)+' кг')}</div>
<div class="card"><h3>Доходы и расходы по месяцам</h3>${chart(md)}</div>
<div class="card"><h3>Кто должен</h3>${dl.length?dl.map(([n,s,k,id])=>`<div class="it"><span>${E(n)} <span class="hint">(посылок: ${k})</span></span><span><b class="m bad">${M(s)}</b> <button class="g s" onclick="invAll('${id}')">Напомнить</button></span></div>`).join(''):'<div class="hint">Долгов нет</div>'}</div>
<h3 style="margin:16px 0 8px">Посылки в работе</h3>${act.length?act.map(pr).join(''):'<div class="em">Пока пусто. Задайте курсы в «Настройках», затем создайте первую посылку.</div>'}`}

function vPk(A){
  const l=A.filter(x=>(ui.fl==='all'||x.pk.status===ui.fl)&&x.pk.name.toLowerCase().includes(ui.q.toLowerCase())).sort((a,b)=>(b.pk.date||'').localeCompare(a.pk.date||''));
  return`<div class="bar"><button onclick="pkDlg()">+ Новая посылка</button><input placeholder="Поиск по названию" value="${E(ui.q)}" onchange="ui.q=this.value;render()" style="max-width:220px"></div>
<div class="chips">${['all',...ST].map(s=>`<span class="chip ${ui.fl===s?'on':''}" onclick="ui.fl='${s}';render()">${s==='all'?'Все':s}</span>`).join('')}</div>${l.length?l.map(pr).join(''):'<div class="em">Посылок не найдено</div>'}`}

function card(r){const id=r.p.id,S=SYM[D.st.cur];
  return`<div class="card" style="border-left:4px solid var(--blue)"><div class="top"><div><b style="font-size:16px">${E(cn(r.p.cu))}</b><div class="hint">товаров: ${r.its.length}</div></div>
<div class="g2" style="min-width:240px"><div><label style="margin:0">Вес, кг</label><input type="number" step="any" class="m" value="${E(r.p.w)}" onchange="upd('pc','${id}','w',this.value)"></div>
${r.self?'<div></div>':`<div><label style="margin:0">Оплачено</label><b class="m">${M(r.paid)}</b> <button class="g s" onclick="payDlg('${id}')">Платежи</button></div>`}</div></div>
<div class="nums m"><div><span>Товары (себест.)</span>${M(r.cost)}</div><div><span>Доставка (реальная)</span>${M(r.dR)}</div><div><span>Товары клиенту</span>${M(r.sale)}</div><div><span>Доставка клиенту</span>${M(r.dC)}</div><div><span>Итого клиенту</span><b>${M(r.total)}</b></div><div><span>Прибыль</span><b class="ok">${M(r.profit)}</b></div></div>
<div class="bar" style="margin:12px 0 4px">${r.self?'<span class="chip">Для себя: без наценки</span>':r.debt>0?`<span class="chip bad">Долг ${M(r.debt)}</span><button class="g s" onclick="payAll('${id}')">Оплатил всё</button>`:(r.total>0||r.extra>0)?`<span class="chip ok">${r.extra>0?'Переплата '+M(r.extra)+' — в прибыли':'Оплачено полностью'}</span>`:''}
<button class="g s" onclick="itDlg('${id}')">+ Товар</button>${r.self?'':`<button class="g s" onclick="inv('${id}')">Счёт клиенту</button>`}<button class="d s" onclick="delPc('${id}')">Убрать человека</button></div>
${r.its.map(i=>`<div class="it"><div><b>${E(i.name)}</b>${i.link?` <a href="${E(i.link)}" target="_blank" rel="noopener" style="color:var(--blue)">ссылка</a>`:''}${i.track?`<span class="hint"> трек ${E(i.track)}</span>`:''}</div>
<div class="m" style="white-space:nowrap">${f(N(i.cost))} → ${f(N(i.sale))} <button class="g s" onclick="itDlg('${id}','${i.id}')">Изменить</button> <button class="d s" onclick="delIt('${i.id}')">×</button></div></div>`).join('')}</div>`}

function vPkg({pk,c}){const t=c.t;
  return`<div class="back" onclick="ui.pkg=null;render()">← Все посылки</div>
<div class="top" style="margin-bottom:12px"><div><h2>${E(pk.name)}</h2><div class="hint">${pk.date||''}${pk.notes?', '+E(pk.notes):''}</div></div>
<div class="bar"><select onchange="upd('pk','${pk.id}','status',this.value)" style="width:auto">${opt(ST,pk.status)}</select><button class="g s" onclick="pkDlg('${pk.id}')">Параметры</button><button class="d s" onclick="delPk('${pk.id}')">Удалить</button></div></div>
<div class="grid">${stat('Себестоимость',M(t.base))}${stat('Клиентам',M(t.total))}${stat('Прибыль по расчёту',M(t.profit),'ok')}${stat('Прибыль по факту',M(t.cash),t.cash<0?'bad':'ok')}${stat('Долг клиентов',M(t.debt),t.debt>0?'bad':'')}${stat('Вес',f(t.w)+' кг')}</div>
${t.noW?'<div class="card bad">Вес людей не указан: доставка посылки пока делится между ними поровну.</div>':''}
<div class="card top"><div><b>Дополнительные расходы</b> <span class="hint">комиссии, упаковка, возвраты</span>${(pk.ex||[]).map(e=>`<div style="padding:2px 0">${E(e.n)}: <b class="m">${M(N(e.a))}</b> <button class="d s" onclick="delEx('${pk.id}','${e.id}')">×</button></div>`).join('')}</div><button class="g s" onclick="exDlg('${pk.id}')">+ Расход</button></div>
<div class="bar"><button onclick="addPc('${pk.id}')">+ Добавить человека</button><button class="g" onclick="tsv('${pk.id}')">Копировать таблицей</button></div>${c.rows.length?c.rows.map(card).join(''):'<div class="em">Добавьте человека, укажите вес его части и товары</div>'}`}

function vCu(A){const rm={};A.forEach(({c})=>c.rows.forEach(r=>rm[r.p.id]=r));
  return`<div class="bar"><button onclick="cuDlg()">+ Добавить человека</button></div>`+(D.cu.length?D.cu.map(c=>{
    const T=D.pc.filter(p=>p.cu===c.id).map(p=>rm[p.id]).filter(Boolean).reduce((a,r)=>({n:a.n+1,t:a.t+r.total+r.extra,p:a.p+r.profit,d:a.d+r.debt}),{n:0,t:0,p:0,d:0});
    return`<div class="card top"><div><b>${E(c.name)}</b><div class="hint">${E(c.contact||'без контакта')}</div></div>
<div class="m hint" style="text-align:right">посылок: ${T.n}, оборот ${M(T.t)}<br>прибыль ${M(T.p)}, долг <b class="${T.d>0?'bad':''}">${M(T.d)}</b></div>
<div class="bar"><button class="g s" onclick="invAll('${c.id}')">Сводный счёт</button><button class="g s" onclick="cuDlg('${c.id}')">Изменить</button><button class="d s" onclick="delCu('${c.id}')">Удалить</button></div></div>`}).join(''):'<div class="em">Здесь будут ваши клиенты. Их также можно создавать прямо в посылке.</div>')}

function vSet(){const s=D.st,S=SYM[s.cur],inp=(k,l,h)=>`<div><label>${l}</label><input type="number" step="any" class="m" value="${E(s[k])}" onchange="setSt('${k}',this.value)"><div class="hint">${h}</div></div>`;
  return`<div class="card"><h3>Валюта и курсы</h3><label>Рабочая валюта (в ней считаются прибыль и цены клиентам)</label><select onchange="setSt('cur',this.value)">${opt(Object.keys(SYM),s.cur)}</select>
<div class="g2">${inp('rr','Реальный курс ¥ → '+S,'По нему считается себестоимость')}${inp('ro','Ваш курс ¥ → '+S,'По нему считается цена клиенту')}</div>
${inp('mk','Наценка на товары не в юанях, %','Цена клиенту = себестоимость + наценка')}</div>
<div class="card"><h3>Доставка</h3><div class="g2">${inp('dr','Реальная цена за кг, '+S,'Сколько платите перевозчику')}${inp('dc','Цена клиенту за кг, '+S,'Сколько берёте с клиента')}</div>
<div class="hint" style="margin-top:8px">Тарифы подставляются в новые посылки и фиксируются в них, старые не меняются. Разница — прибыль на доставке. Если знаете точную стоимость доставки посылки, впишите её в параметрах посылки: она заменит расчёт по весу.</div></div>
<div class="card"><h3>Данные</h3><div class="hint">Последняя копия: ${D.st.bk?Math.floor((Date.now()-D.st.bk)/864e5)+' дн. назад':'не делалась'}. Всё хранится только в этом браузере. Сохраните резервную копию: она нужна, чтобы перенести данные или восстановить их после очистки браузера.</div>
<div class="bar" style="margin-top:10px"><button onclick="bk()">Резервная копия</button><button class="d" onclick="conf('Удалить все посылки, товары и людей без возможности восстановления?',()=>{D=def();save();ui.pkg=null;render()},'Стереть всё')">Стереть все данные</button></div></div>`}

function render(){const y=scrollY,A=all(),P=A.reduce((s,x)=>s+x.c.t.profit,0),cur=ui.pkg&&A.find(x=>x.pk.id===ui.pkg);
  const v=ui.tab==='dash'?vDash(A):ui.tab==='pk'?(cur?vPkg(cur):vPk(A)):ui.tab==='cu'?vCu(A):ui.tab==='calc'?vCalc():vSet();
  $('#app').innerHTML=`${U?'<div id="undo" class="card top" style="margin-top:10px"><span>Изменение выполнено.</span><button class="g s" onclick="undo()">Отменить</button></div>':''}<div class="hd"><h1>Посылки из Китая</h1><div class="tot"><b class="m ${P<0?'bad':'ok'}">${M(P)}</b><span>общая прибыль</span></div></div>
<div class="tabs">${[['dash','Обзор'],['pk','Посылки'],['cu','Люди'],['calc','Калькулятор'],['set','Настройки']].map(([k,n])=>`<div class="tab ${ui.tab===k?'on':''}" onclick="tab('${k}')">${n}</div>`).join('')}</div>${v}`;
  scrollTo(0,y)}
const tab=t=>{ui.tab=t;ui.pkg=null;render()},openPk=id=>{ui.tab='pk';ui.pkg=id;render();scrollTo(0,0)};
const upd=(t,id,k,v)=>{D[t].find(x=>x.id===id)[k]=v;save();render()},setSt=(k,v)=>{D.st[k]=v;save();render()};
const payAll=id=>{const p=D.pc.find(x=>x.id===id);p.pay.push({id:uid(),d:today(),a:String(rowOf(id).debt),n:'Оплата остатка'});save();render()};

function dlg(title,body,ok,label='Сохранить',danger){const d=$('#dlg');if(d.open)d.close();
  d.innerHTML=`<form method="dialog"><h3>${title}</h3>${body}<div class="act"><button type="button" class="g" onclick="$('#dlg').close('x')">Закрыть</button>${ok?`<button class="${danger?'d':''}" value="ok">${label}</button>`:''}</div></form>`;
  d.onclose=()=>{if(d.returnValue==='ok'&&ok)ok(n=>(d.querySelector('[name='+n+']')||{value:''}).value)};d.returnValue='';d.showModal()}
const conf=(msg,fn,label)=>dlg('Подтвердите действие',`<p>${msg}</p>`,()=>{snap();fn()},label||'Удалить',1);
let U=null,UT;
const snap=()=>{U=JSON.stringify(D);clearTimeout(UT);UT=setTimeout(()=>{U=null;const e=$('#undo');if(e)e.remove()},15000)};
const undo=()=>{if(U){D=JSON.parse(U);U=null;save();render()}};
const bkWarn=()=>D.pk.length&&(!D.st.bk||Date.now()-D.st.bk>12096e5)?'<div class="card top bad"><span>Резервная копия не делалась больше 14 дней.</span><button class="g s" onclick="bk()">Сделать копию</button></div>':'';

function pkDlg(id){const p=D.pk.find(x=>x.id===id)||{name:'',date:new Date().toISOString().slice(0,10),status:ST[0],del:'',notes:'',dr:D.st.dr,dc:D.st.dc,ex:[]};
  dlg(id?'Параметры посылки':'Новая посылка',`<label>Название</label><input name="name" required value="${E(p.name)}" placeholder="Например, СП «Лето»">
<div class="g2"><div><label>Дата</label><input type="date" name="date" value="${p.date}"></div><div><label>Статус</label><select name="status">${opt(ST,p.status)}</select></div></div>
<label>Реальная стоимость доставки всей посылки, ${SYM[D.st.cur]} (необязательно)</label><input type="number" step="any" name="del" value="${E(p.del)}" placeholder="Иначе: вес × реальная цена за кг">
<div class="g2"><div><label>Реальная цена за кг</label><input type="number" step="any" name="dr" class="m" value="${E(p.dr)}"></div><div><label>Цена клиенту за кг</label><input type="number" step="any" name="dc" class="m" value="${E(p.dc)}"></div></div><div class="hint">Тарифы фиксируются в посылке: смена настроек её не изменит.</div>
<label>Заметки</label><textarea name="notes" rows="2">${E(p.notes)}</textarea>`,g=>{
    Object.assign(p,{name:g('name').trim(),date:g('date'),status:g('status'),del:g('del'),notes:g('notes'),dr:g('dr'),dc:g('dc')});
    if(!id){p.id=uid();D.pk.unshift(p);ui.tab='pk';ui.pkg=p.id}save();render()})}
function delPk(id){conf('Удалить посылку вместе с людьми и товарами в ней?',()=>{const ps=D.pc.filter(p=>p.pkg===id).map(p=>p.id);D.it=D.it.filter(i=>!ps.includes(i.pc));D.pc=D.pc.filter(p=>p.pkg!==id);D.pk=D.pk.filter(p=>p.id!==id);ui.pkg=null;save();render()})}

function addPc(pkId){const ex=D.pc.filter(p=>p.pkg===pkId).map(p=>p.cu),o=D.cu.filter(c=>!ex.includes(c.id)).map(c=>[c.id,c.name]);if(!ex.includes(''))o.push(['','Для себя (без наценки)']);
  dlg('Добавить человека',`<label>Из списка</label><select name="cu">${o.map(([v,n])=>`<option value="${v}">${E(n)}</option>`).join('')}</select><label>Или новый человек</label><input name="nn" placeholder="Имя">`,g=>{
    let cu=g('cu');const nn=g('nn').trim();if(nn){cu=uid();D.cu.push({id:cu,name:nn,contact:''})}else if(!o.length)return;
    D.pc.push({id:uid(),pkg:pkId,cu,w:'',pay:[]});save();render()},'Добавить')}
const delPc=id=>conf('Убрать человека из посылки вместе с его товарами?',()=>{D.it=D.it.filter(i=>i.pc!==id);D.pc=D.pc.filter(p=>p.id!==id);save();render()},'Убрать');

function itCalc(){const g=n=>$('#dlg [name='+n+']'),p=N(g('price').value);if(p){
  if(g('pcur').value==='CNY'){const rr=N(D.st.rr)||N(D.st.ro),ro=N(D.st.ro)||rr;g('cost').value=R(p*rr);g('sale').value=R(p*ro)}
  else{g('cost').value=R(p);g('sale').value=R(p*(1+N(D.st.mk)/100))}}mg()}
function mg(){const g=n=>N($('#dlg [name='+n+']').value),m=$('#mg');if(m)m.innerHTML=`Маржа по товару: <b class="m ${g('sale')-g('cost')<0?'bad':'ok'}">${M(g('sale')-g('cost'))}</b>`}
function itDlg(pc,id){const i=D.it.find(x=>x.id===id)||{pc,name:'',link:'',track:'',price:'',pcur:'CNY',cost:'',sale:''},S=SYM[D.st.cur];
  dlg(id?'Изменить товар':'Новый товар',`<label>Товар</label><input name="name" required value="${E(i.name)}" placeholder="Кроссовки Nike, 2 пары"><label>Ссылка</label><input name="link" value="${E(i.link)}">
<div class="g3"><div><label>Цена</label><input type="number" step="any" name="price" class="m" value="${E(i.price)}" oninput="itCalc()"></div><div><label>Валюта цены</label><select name="pcur" onchange="itCalc()"><option value="CNY" ${i.pcur==='CNY'?'selected':''}>¥ юань</option><option value="own" ${i.pcur==='own'?'selected':''}>${S}</option></select></div><div><label>Трек-номер</label><input name="track" value="${E(i.track)}"></div></div>
<div class="g2"><div><label>Себестоимость, ${S}</label><input type="number" step="any" name="cost" class="m" value="${E(i.cost)}" oninput="mg()"></div><div><label>Цена клиенту, ${S}</label><input type="number" step="any" name="sale" class="m" value="${E(i.sale)}" oninput="mg()"></div></div><div class="bk" id="mg"></div>`,g=>{
    Object.assign(i,{name:g('name').trim(),link:g('link').trim(),track:g('track').trim(),price:g('price'),pcur:g('pcur'),cost:g('cost'),sale:g('sale')});
    if(!id){i.id=uid();D.it.push(i)}save();render()});mg()}
const delIt=id=>conf('Удалить этот товар?',()=>{D.it=D.it.filter(i=>i.id!==id);save();render()});

function cuDlg(id){const c=D.cu.find(x=>x.id===id)||{name:'',contact:''};
  dlg(id?'Изменить человека':'Новый человек',`<label>Имя</label><input name="name" required value="${E(c.name)}"><label>Контакт (телефон, ник)</label><input name="contact" value="${E(c.contact)}">`,g=>{
    Object.assign(c,{name:g('name').trim(),contact:g('contact').trim()});if(!id){c.id=uid();D.cu.push(c)}save();render()})}
const delCu=id=>D.pc.some(p=>p.cu===id)?dlg('Нельзя удалить','<p>Этот человек участвует в посылках. Сначала уберите его из них.</p>'):conf('Удалить человека из списка?',()=>{D.cu=D.cu.filter(c=>c.id!==id);save();render()});

function inv(id){const r=rowOf(id),pk=D.pk.find(p=>p.id===r.p.pkg);
  const t=`Привет, ${cn(r.p.cu)}! Заказ «${pk.name}»:\n`+r.its.map(i=>`• ${i.name}: ${M(N(i.sale))}`).join('\n')+`\nДоставка (${f(r.w)} кг): ${M(r.dC)}\nИтого: ${M(r.total)}\nОплачено: ${M(r.paid)}\nК оплате: ${M(r.debt)}`+(r.extra>0?`\nПереплата: ${M(r.extra)}`:'');
  dlg('Счёт клиенту',`<textarea rows="9" readonly onfocus="this.select()">${E(t)}</textarea><div class="hint">Нажмите на текст, скопируйте его и отправьте клиенту.</div>`)}
function payDlg(id){const p=D.pc.find(x=>x.id===id),r=rowOf(id);
  dlg('Платежи: '+E(cn(p.cu)),`<div class="hint">Итого клиенту ${M(r.total)}, оплачено ${M(r.paid)}</div>${p.pay.map(x=>`<div class="it"><span>${x.d||'без даты'} ${E(x.n)}</span><span class="m">${f(N(x.a))} <button type="button" class="d s" onclick="delPay('${id}','${x.id}')">×</button></span></div>`).join('')}
<div class="g3"><div><label>Дата</label><input type="date" name="d" value="${today()}"></div><div><label>Сумма</label><input type="number" step="any" name="a" class="m"></div><div><label>Комментарий</label><input name="n"></div></div>`,g=>{if(N(g('a'))){p.pay.push({id:uid(),d:g('d'),a:g('a'),n:g('n').trim()});save();render()}},'Добавить платёж')}
const delPay=(id,pid)=>{const p=D.pc.find(x=>x.id===id);p.pay=p.pay.filter(x=>x.id!==pid);save();render();payDlg(id)};
function exDlg(id){dlg('Дополнительный расход',`<label>Название</label><input name="n" required placeholder="Комиссия посредника"><label>Сумма, ${SYM[D.st.cur]}</label><input type="number" step="any" name="a" required class="m"><div class="hint">Возврат денег от продавца вводите со знаком минус.</div>`,g=>{D.pk.find(p=>p.id===id).ex.push({id:uid(),n:g('n').trim(),a:g('a')});save();render()})}
const delEx=(id,eid)=>conf('Удалить расход?',()=>{const p=D.pk.find(x=>x.id===id);p.ex=p.ex.filter(e=>e.id!==eid);save();render()});
function invAll(c){const L=[];let s=0;all().forEach(({pk,c:k})=>k.rows.forEach(r=>{if(r.p.cu===c&&r.debt>0){L.push(`• «${pk.name}»: ${M(r.debt)}`);s+=r.debt}}));
  dlg('Сводный счёт',`<textarea rows="8" readonly onfocus="this.select()">${E(L.length?`Привет, ${cn(c)}! Напоминаю об оплате:\n${L.join('\n')}\nВсего: ${M(s)}`:'Долгов нет')}</textarea><div class="hint">Скопируйте текст и отправьте клиенту.</div>`)}
function tsv(id){const{c}=all().find(x=>x.pk.id===id),L=['Клиент\tТовар\tТрек\tСебестоимость\tЦена клиенту'];
  c.rows.forEach(r=>{r.its.forEach(i=>L.push([cn(r.p.cu),i.name,i.track||'',N(i.cost),N(i.sale)].join('\t')));L.push([cn(r.p.cu),'Доставка','',R(r.dR),R(r.dC)].join('\t'))});
  dlg('Таблица для вставки',`<textarea rows="10" class="m" readonly onfocus="this.select()">${E(L.join('\n'))}</textarea><div class="hint">Скопируйте и вставьте в Google Таблицы или Excel.</div>`)}
const vCalc=()=>`<div class="card"><h3>Калькулятор цены</h3><div class="g2"><div><label>Цена, ¥</label><input id="cp" type="number" step="any" class="m" oninput="cc()"></div><div><label>Вес, кг</label><input id="cw" type="number" step="any" class="m" oninput="cc()"></div></div><div class="bk m" id="cr">Введите цену и вес</div><div class="hint">Используются курсы и тарифы из настроек.</div></div>`;
function cc(){const p=N($('#cp').value),w=N($('#cw').value),s=D.st,rr=N(s.rr)||N(s.ro),ro=N(s.ro)||rr,c=p*rr+w*N(s.dr),t=p*ro+w*N(s.dc);
  $('#cr').innerHTML=`Назвать клиенту: <b>${M(t)}</b> (товар ${M(p*ro)}, доставка ${M(w*N(s.dc))})<br>Ваши затраты: ${M(c)}<br>Прибыль: <b class="${t-c<0?'bad':'ok'}">${M(t-c)}</b>, маржа ${c?f((t-c)/c*100):0}%`}
function bk(){D.st.bk=Date.now();save();render();dlg('Резервная копия',`<div class="hint">Скопируйте текст и сохраните его в надёжном месте. Чтобы восстановить данные, вставьте сохранённый текст вместо этого и нажмите «Загрузить».</div><textarea name="j" rows="10" class="m" onfocus="this.select()">${E(JSON.stringify(D))}</textarea>`,g=>{
    try{const x=JSON.parse(g('j'));if(!Array.isArray(x.pk))throw 0;D={...def(),...x,st:{...def().st,...x.st}};mig();save();render()}catch(e){dlg('Не удалось загрузить','<p>Текст повреждён или не относится к этому приложению. Вставьте копию целиком.</p>')}},'Загрузить',1)}
render();
</script></body></html>
