<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт посылок из Китая</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #F3F0E6;
            --paper-2: #EAE5D6;
            --ink: #1E2A38;
            --ink-soft: #4A5A6A;
            --line: #C9C2AF;
            --stamp: #C1442E;
            --gold: #C89B3C;
            --profit: #3E6B52;
            --profit-bg: #E4EDE7;
            --loss-bg: #F6E4E0;
            --white: #FCFBF7;
            --shadow: rgba(30,42,56,0.16);
            --radius: 8px;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        h1,
        h2,
        h3 {
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
        }
        .mono {
            font-family: 'IBM Plex Mono', monospace;
        }
        .wrap {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px 20px 80px;
        }

        /* ---- header ---- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 18px;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header .title-block .kicker {
            font-size: 12px;
            letter-spacing: .04em;
            color: var(--ink-soft);
            margin-bottom: 4px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
        }
        .header .stamp {
            border: 2px solid var(--stamp);
            color: var(--stamp);
            padding: 6px 14px;
            border-radius: 3px;
            transform: rotate(-3deg);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
        }

        .tabs {
            display: flex;
            gap: 2px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--line);
        }
        .tab {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--ink-soft);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            user-select: none;
            transition: color .15s, border-color .15s;
        }
        .tab:hover {
            color: var(--ink);
        }
        .tab.active {
            color: var(--ink);
            border-bottom-color: var(--stamp);
            font-weight: 600;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 16px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 14px 16px;
        }
        .stat .label {
            font-size: 11.5px;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }
        .stat .value {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 22px;
            font-weight: 600;
        }
        .stat.profit .value {
            color: var(--profit);
        }

        label {
            display: block;
            font-size: 12.5px;
            color: var(--ink-soft);
            margin-bottom: 4px;
            margin-top: 10px;
        }
        input,
        select,
        textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            background: var(--white);
            color: var(--ink);
            transition: border-color .15s, outline .15s;
        }
        input.mono-input {
            font-family: 'IBM Plex Mono', monospace;
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid var(--gold);
            outline-offset: -1px;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .row3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
        }
        @media(max-width:600px) {
            .row,
            .row3 {
                grid-template-columns: 1fr;
            }
        }

        button {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 13.5px;
            border-radius: 4px;
            border: 1px solid var(--ink);
            padding: 9px 16px;
            cursor: pointer;
            background: var(--ink);
            color: var(--white);
            transition: background .15s, color .15s, border-color .15s, opacity .15s;
        }
        button:hover {
            opacity: .88;
        }
        button.secondary {
            background: transparent;
            color: var(--ink);
        }
        button.secondary:hover {
            background: var(--paper-2);
        }
        button.danger {
            background: transparent;
            color: var(--stamp);
            border-color: var(--stamp);
        }
        button.danger:hover {
            background: var(--loss-bg);
        }
        button.small {
            padding: 5px 10px;
            font-size: 12px;
        }
        button.success {
            background: var(--profit);
            border-color: var(--profit);
            color: #fff;
        }
        button.success:hover {
            background: #2d5a44;
        }
        button:disabled {
            opacity: .5;
            pointer-events: none;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .breakdown {
            background: var(--paper-2);
            border: 1px dashed var(--line);
            border-radius: 5px;
            padding: 12px 14px;
            margin-top: 14px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
        }
        .breakdown div {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }
        .breakdown .final {
            border-top: 1px solid var(--line);
            margin-top: 6px;
            padding-top: 6px;
            font-weight: 600;
        }
        .breakdown .profit {
            color: var(--profit);
            font-weight: 600;
        }

        .order-item {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--white);
            padding: 14px 16px;
            margin-bottom: 10px;
        }
        .order-item .top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .order-item .who {
            font-weight: 600;
            font-size: 14.5px;
        }
        .order-item .what {
            color: var(--ink-soft);
            font-size: 13px;
            margin-top: 2px;
        }
        .order-item .date {
            font-size: 11.5px;
            color: var(--ink-soft);
            font-family: 'IBM Plex Mono', monospace;
        }
        .nums {
            display: flex;
            gap: 18px;
            margin-top: 10px;
            flex-wrap: wrap;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
        }
        .nums>div {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .nums .num-label {
            color: var(--ink-soft);
            font-size: 10.5px;
            display: block;
            font-family: 'Inter', sans-serif;
        }
        .profit-val {
            color: var(--profit);
            font-weight: 600;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            padding: 3px 9px;
            border-radius: 20px;
            border: 1px solid var(--line);
            color: var(--ink-soft);
        }
        .badge.paid {
            background: var(--profit-bg);
            color: var(--profit);
            border-color: var(--profit);
        }
        .badge.delivery-paid {
            background: #E0EDF5;
            color: #2A6B8C;
            border-color: #2A6B8C;
        }
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--ink-soft);
            font-size: 14px;
        }
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filters select,
        .filters input {
            width: auto;
            min-width: 140px;
        }

        .cust-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--white);
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .cust-item .name {
            font-weight: 600;
        }
        .cust-item .meta {
            font-size: 12.5px;
            color: var(--ink-soft);
            margin-top: 2px;
        }
        .cust-stats {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12.5px;
            color: var(--ink-soft);
            text-align: right;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 14px;
        }
        .hint {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 4px;
        }
        .close-x {
            cursor: pointer;
            color: var(--ink-soft);
            font-size: 13px;
            background: none;
            border: none;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        .close-x:hover {
            color: var(--ink);
        }

        .pkg-row {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--white);
            padding: 14px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: border-color .15s, box-shadow .15s;
        }
        .pkg-row:hover {
            border-color: var(--gold);
            box-shadow: 0 2px 8px var(--shadow);
        }
        .pkg-row .top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .pkg-row .name {
            font-weight: 600;
            font-size: 15px;
        }
        .pkg-row .meta {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 2px;
        }
        .back-link {
            cursor: pointer;
            color: var(--ink-soft);
            font-size: 13px;
            margin-bottom: 14px;
            display: inline-block;
        }
        .back-link:hover {
            color: var(--ink);
        }
        .pkg-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        /* ---- modals ---- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 42, 56, .5);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 30px 16px;
            overflow: auto;
            z-index: 999;
            animation: modalFade .18s ease;
        }
        @keyframes modalFade {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal-box {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 28px 30px 24px;
            max-width: 460px;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 12px 40px var(--shadow);
            position: relative;
        }
        .modal-box .modal-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .modal-box .modal-msg {
            font-size: 14.5px;
            color: var(--ink-soft);
            line-height: 1.6;
            margin-bottom: 18px;
        }
        .modal-box .modal-msg strong {
            color: var(--ink);
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .modal-box .modal-actions button {
            min-width: 90px;
        }
        .modal-box .modal-close-top {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 20px;
            color: var(--ink-soft);
            background: none;
            border: none;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
        }
        .modal-box .modal-close-top:hover {
            color: var(--ink);
        }
        .modal-box .modal-icon {
            font-size: 32px;
            margin-bottom: 6px;
        }
        .modal-box.warning .modal-icon {
            color: var(--stamp);
        }
        .modal-box.info .modal-icon {
            color: var(--gold);
        }
        .modal-box.success .modal-icon {
            color: var(--profit);
        }

        /* delivery debt button */
        .delivery-debt-btn {
            border-color: #2A6B8C;
            color: #2A6B8C;
            background: transparent;
        }
        .delivery-debt-btn:hover {
            background: #E0EDF5;
        }
        .delivery-debt-btn.paid {
            background: #E0EDF5;
            color: #1A4B6C;
            border-color: #1A4B6C;
        }

        .debt-summary {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 12.5px;
            color: var(--ink-soft);
            margin-top: 4px;
        }
        .debt-summary .debt-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .debt-summary .debt-item .label {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            color: var(--ink-soft);
            margin: 0;
        }
        .debt-summary .debt-item .val {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 500;
        }
        .debt-summary .debt-item .val.debt-ok {
            color: var(--profit);
        }
        .debt-summary .debt-item .val.debt-bad {
            color: var(--stamp);
        }

        /* responsive modals */
        @media(max-width:500px) {
            .modal-box {
                padding: 20px 18px;
            }
            .modal-box .modal-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="wrap" id="app"></div>

    <script>
        // ============================================================
        //  Modal system – beautiful custom dialogs
        // ============================================================
        function showModal(options) {
            return new Promise((resolve) => {
                const {
                    title,
                    message,
                    type = 'info', // 'info' | 'warning' | 'success'
                    confirmText = 'OK',
                    cancelText = 'Отмена',
                    showCancel = false,
                    icon = null,
                } = options;

                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';

                const iconMap = {
                    info: 'ℹ️',
                    warning: '⚠️',
                    success: '✅',
                };
                const iconChar = icon || iconMap[type] || 'ℹ️';

                overlay.innerHTML = `
              <div class="modal-box ${type}">
                <button class="modal-close-top" data-close>✕</button>
                <div class="modal-icon">${iconChar}</div>
                <div class="modal-title">${title}</div>
                <div class="modal-msg">${message}</div>
                <div class="modal-actions">
                  ${showCancel ? `<button class="secondary" data-cancel>${cancelText}</button>` : ''}
                  <button data-confirm class="${type === 'warning' ? 'danger' : 'success'}">${confirmText}</button>
                </div>
              </div>
            `;

                document.body.appendChild(overlay);

                const box = overlay.querySelector('.modal-box');
                const confirmBtn = box.querySelector('[data-confirm]');
                const cancelBtn = box.querySelector('[data-cancel]');
                const closeBtn = box.querySelector('[data-close]');

                function cleanup(result) {
                    if (overlay.parentNode) overlay.remove();
                    resolve(result);
                }

                confirmBtn.addEventListener('click', () => cleanup(true));
                if (cancelBtn) cancelBtn.addEventListener('click', () => cleanup(false));
                if (closeBtn) closeBtn.addEventListener('click', () => cleanup(false));
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) cleanup(false);
                });

                // Enter key triggers confirm
                const onKey = (e) => {
                    if (e.key === 'Enter') { e.preventDefault();
                        cleanup(true); }
                    if (e.key === 'Escape') { cleanup(false); }
                };
                document.addEventListener('keydown', onKey);
                // clean up listener when resolved
                const origCleanup = cleanup;
                cleanup = (result) => {
                    document.removeEventListener('keydown', onKey);
                    origCleanup(result);
                };
                // focus confirm
                setTimeout(() => confirmBtn.focus(), 80);
            });
        }

        function showConfirm(title, message, options) {
            return showModal({
                title,
                message,
                type: 'warning',
                confirmText: (options && options.confirmText) || 'Да, удалить',
                cancelText: (options && options.cancelText) || 'Отмена',
                showCancel: true,
                icon: (options && options.icon) || '⚠️',
            });
        }

        function showAlert(title, message, options) {
            return showModal({
                title,
                message,
                type: (options && options.type) || 'info',
                confirmText: (options && options.confirmText) || 'OK',
                showCancel: false,
                icon: (options && options.icon) || 'ℹ️',
            });
        }

        // ============================================================
        //  Storage
        // ============================================================
        const hasNativeStorage = (typeof window !== 'undefined') && window.storage && typeof window.storage.get ===
        'function';
        if (!hasNativeStorage) {
            console.info('window.storage недоступен — сайт работает автономно и хранит данные в localStorage этого браузера.');
        }

        function localSet(key, val) {
            try { localStorage.setItem('parcels_v3_' + key, JSON.stringify(val)); return true; } catch (e) { console.error(
                    'localStorage set failed', key, e); return false; }
        }

        function localGet(key) {
            try { const v = localStorage.getItem('parcels_v3_' + key); return v === null ? undefined : JSON.parse(v); } catch (
            e) { return undefined; }
        }

        const store = {
            async get(key) {
                if (hasNativeStorage) {
                    try {
                        const r = await window.storage.get(key, false);
                        return r ? JSON.parse(r.value) : null;
                    } catch (e) {
                        const local = localGet(key);
                        return local !== undefined ? local : null;
                    }
                }
                const local = localGet(key);
                return local !== undefined ? local : null;
            },
            async set(key, val, attempt) {
                attempt = attempt || 1;
                localSet(key, val);
                if (!hasNativeStorage) { pendingSaves.delete(key);
                    updateSaveStatus(); return true; }
                try {
                    await window.storage.set(key, JSON.stringify(val), false);
                    pendingSaves.delete(key);
                    updateSaveStatus();
                    return true;
                } catch (e) {
                    console.error('storage error', key, e);
                    if (attempt < 3) {
                        await new Promise(res => setTimeout(res, 500 * attempt));
                        return store.set(key, val, attempt + 1);
                    }
                    pendingSaves.add(key);
                    updateSaveStatus();
                    return false;
                }
            }
        };
        const pendingSaves = new Set();

        function updateSaveStatus() {
            const el = document.getElementById('saveStatus');
            if (!el) return;
            if (pendingSaves.size === 0) {
                el.textContent = '';
            } else {
                el.innerHTML =
                    'Изменения сохранены в этом браузере, но не синхронизировались с облаком. <span style="text-decoration:underline;cursor:pointer;" onclick="retryAllSaves()">Повторить</span>';
            }
        }

        async function retryAllSaves() {
            const jobs = [];
            if (pendingSaves.has('customers')) jobs.push(saveCustomers());
            if (pendingSaves.has('packages')) jobs.push(savePackages());
            if (pendingSaves.has('items')) jobs.push(saveItems());
            if (pendingSaves.has('package_clients')) jobs.push(savePackageClients());
            if (pendingSaves.has('settings_v3')) jobs.push(saveSettings());
            await Promise.all(jobs);
        }

        // ============================================================
        //  Constants & State
        // ============================================================
        const CURRENCIES = {
            RUB: { symbol: '₽', label: 'Российский рубль' },
            BYN: { symbol: 'Br', label: 'Белорусский рубль' },
            USD: { symbol: '$', label: 'Доллар США' }
        };
        const PACKAGE_STATUSES = ['Собирается', 'В пути', 'Прибыла', 'Выдана'];

        let state = {
            loaded: false,
            tab: 'dashboard',
            customers: [],
            packages: [],
            items: [],
            packageClients: [],
            settings: {
                currency: 'RUB',
                cnyRate: 0,
                cnyRateReal: 0,
                usdRate: 0,
                pricePerKg: 0,
                deliveryRateReal: 0,
                deliveryRateCustomer: 0,
            },
            cnyAuto: { rate: null, updatedAt: null, loading: false, error: null },
            viewingPackageId: null,
            editingPackageId: null,
            packageDraft: null,
            editingItemId: null,
            itemDraft: null,
            addingClientToPkgId: null,
        };

        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

        function fmt(n) { return (Math.round((n || 0) * 100) / 100).toLocaleString('ru-RU'); }

        function todayStr() { return new Date().toISOString().slice(0, 10); }

        function cur() { return CURRENCIES[state.settings.currency]?.symbol || '₽'; }

        function pick(a, b, c) {
            if (a !== '' && a !== undefined && a !== null) return Number(a);
            if (b !== '' && b !== undefined && b !== null) return Number(b);
            return Number(c) || 0;
        }

        // ============================================================
        //  Calculations – updated: no extraShare, delivery in customer price
        // ============================================================
        function calcPackage(pkg, clients, items, settings) {
            const totalWeight = clients.reduce((s, c) => s + (Number(c.weight) || 0), 0);
            const manualDelivery = Number(pkg.deliveryTotal) || 0;

            // Real delivery cost: use manual if set, else rate * weight
            const realRate = Number(settings.deliveryRateReal) || 0;
            const customerRate = Number(settings.deliveryRateCustomer) || 0;
            const autoReal = realRate * totalWeight;
            const autoCustomer = customerRate * totalWeight;

            const deliveryRealTotal = manualDelivery > 0 ? manualDelivery : autoReal;
            const deliveryCustomerTotal = manualDelivery > 0 ? manualDelivery : autoCustomer;

            const groups = clients.map(c => {
                const w = Number(c.weight) || 0;
                const share = totalWeight > 0 ? (w / totalWeight) : (clients.length ? 1 / clients.length : 0);
                const deliveryRealShare = deliveryRealTotal * share;
                const deliveryCustomerShare = deliveryCustomerTotal * share;

                const clientItems = items.filter(it => it.customerId === c.customerId);
                const itemCostSum = clientItems.reduce((s, it) => s + (Number(it.itemCost) || 0), 0);
                const saleSum = clientItems.reduce((s, it) => s + (Number(it.salePrice) || 0), 0);

                const base = itemCostSum + deliveryRealShare;
                const customerTotal = saleSum + deliveryCustomerShare;
                const profit = customerTotal - base;

                const paidAmount = Number(c.paidAmount) || 0;
                const deliveryPaidAmount = Number(c.deliveryPaidAmount) || 0;
                const totalPaid = paidAmount + deliveryPaidAmount;
                const debt = Math.max(0, Math.round((customerTotal - totalPaid) * 100) / 100);

                const productDebt = Math.max(0, Math.round((saleSum - paidAmount) * 100) / 100);
                const deliveryDebt = Math.max(0, Math.round((deliveryCustomerShare - deliveryPaidAmount) * 100) / 100);

                return {
                    client: c,
                    customerId: c.customerId,
                    weight: w,
                    items: clientItems,
                    itemCostSum,
                    deliveryRealShare,
                    deliveryCustomerShare,
                    base,
                    saleSum,
                    customerTotal,
                    profit,
                    paidAmount,
                    deliveryPaidAmount,
                    debt,
                    productDebt,
                    deliveryDebt,
                    weightShare: share
                };
            });

            const totals = groups.reduce((acc, g) => ({
                base: acc.base + g.base,
                revenue: acc.revenue + g.saleSum,
                customerTotal: acc.customerTotal + g.customerTotal,
                profit: acc.profit + g.profit,
                weight: acc.weight + g.weight,
                debt: acc.debt + g.debt,
                productDebt: acc.productDebt + g.productDebt,
                deliveryDebt: acc.deliveryDebt + g.deliveryDebt,
            }), { base: 0, revenue: 0, customerTotal: 0, profit: 0, weight: 0, debt: 0, productDebt: 0, deliveryDebt: 0 });

            return { groups, totals, deliveryRealTotal, deliveryCustomerTotal };
        }

        function itemsForPackage(pkgId) { return state.items.filter(i => i.packageId === pkgId); }

        function clientsForPackage(pkgId) { return state.packageClients.filter(c => c.packageId === pkgId); }

        function allGroupCalcs() {
            const map = {};
            state.packages.forEach(pkg => {
                const { groups } = calcPackage(pkg, clientsForPackage(pkg.id), itemsForPackage(pkg.id), state
                .settings);
                groups.forEach(g => { map[g.client.id] = g; });
            });
            return map;
        }

        async function fetchCnyAutoRate() {
            state.cnyAuto.loading = true;
            state.cnyAuto.error = null;
            if (state.tab === 'settings') render();
            try {
                const res = await fetch('https://api.nbrb.by/exrates/rates/CNY?parammode=2');
                if (!res.ok) throw new Error('bad status ' + res.status);
                const data = await res.json();
                const scale = Number(data.Cur_Scale) || 1;
                const rate = Number(data.Cur_OfficialRate) / scale;
                if (!rate) throw new Error('empty rate');
                state.cnyAuto.rate = rate;
                state.cnyAuto.updatedAt = data.Date || todayStr();
                if (state.settings.currency === 'BYN') {
                    state.settings.cnyRateReal = rate;
                    saveSettings();
                }
            } catch (e) {
                console.error('Не удалось получить курс юаня из интернета', e);
                state.cnyAuto.error = 'Не получилось загрузить курс автоматически (возможно, нет связи с nbrb.by)';
            }
            state.cnyAuto.loading = false;
            if (state.tab === 'settings') render();
        }

        // ============================================================
        //  CSV export
        // ============================================================
        function exportPackageCsv(pkgId) {
            const pkg = state.packages.find(p => p.id === pkgId);
            const clients = clientsForPackage(pkgId);
            const items = itemsForPackage(pkgId);
            if (clients.length === 0) {
                showAlert('Нет данных', 'В посылке пока никого нет, нечего выгружать.', { icon: '📄' });
                return;
            }
            const { groups } = calcPackage(pkg, clients, items, state.settings);
            const header = ['Клиент', 'Вес кг', 'Товар', 'Ссылка', 'Трек-номер', 'Стоимость товара', 'Цена продажи',
                'Доля доставки (реальная)', 'Доля доставки (клиенту)', 'Итого цена клиенту', 'Прибыль', 'Получено (товары)',
                'Получено (доставка)', 'Долг всего'
            ];
            const lines = [header.join(';')];
            groups.forEach(g => {
                if (g.items.length === 0) {
                    lines.push([custName(g.customerId), fmt(g.weight), '(товаров нет)', '', '', '', '',
                        fmt(g.deliveryRealShare), fmt(g.deliveryCustomerShare), fmt(g.customerTotal), fmt(g.profit),
                        fmt(g.paidAmount), fmt(g.deliveryPaidAmount), fmt(g.debt)
                    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(';'));
                    return;
                }
                g.items.forEach((it, idx) => {
                    lines.push([
                        idx === 0 ? custName(g.customerId) : '',
                        idx === 0 ? fmt(g.weight) : '',
                        it.name,
                        it.link || '',
                        it.tracking || '',
                        fmt(it.itemCost),
                        fmt(it.salePrice),
                        idx === 0 ? fmt(g.deliveryRealShare) : '',
                        idx === 0 ? fmt(g.deliveryCustomerShare) : '',
                        idx === 0 ? fmt(g.customerTotal) : '',
                        idx === 0 ? fmt(g.profit) : '',
                        idx === 0 ? fmt(g.paidAmount) : '',
                        idx === 0 ? fmt(g.deliveryPaidAmount) : '',
                        idx === 0 ? fmt(g.debt) : ''
                    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(';'));
                });
            });
            const csv = '\uFEFF' + lines.join('\r\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (pkg.name || 'posylka').replace(/[^\wа-яА-Я0-9 -]/g, '') + '.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ============================================================
        //  Render
        // ============================================================
        function render() {
            const app = document.getElementById('app');
            if (!state.loaded) { app.innerHTML = '<div class="empty">Загрузка…</div>'; return; }
            const map = allGroupCalcs();
            const totalProfit = Object.values(map).reduce((s, r) => s + r.profit, 0);
            app.innerHTML = `
            <div class="header">
              <div class="title-block">
                <div class="kicker">ЛИЧНЫЙ УЧЁТ · ЗАКАЗЫ ИЗ КИТАЯ</div>
                <h1>Посылки и прибыль</h1>
              </div>
              <div class="stamp">${totalProfit >= 0 ? 'В ПЛЮСЕ' : 'В МИНУСЕ'} · ${cur()}${fmt(totalProfit)}</div>
            </div>
            <div id="saveStatus" style="color:var(--stamp);font-size:12.5px;margin:-12px 0 14px;"></div>
            <div class="tabs">
              <div class="tab ${state.tab === 'dashboard' ? 'active' : ''}" onclick="setTab('dashboard')">Дашборд</div>
              <div class="tab ${state.tab === 'packages' ? 'active' : ''}" onclick="setTab('packages')">Посылки</div>
              <div class="tab ${state.tab === 'customers' ? 'active' : ''}" onclick="setTab('customers')">Люди</div>
              <div class="tab ${state.tab === 'settings' ? 'active' : ''}" onclick="setTab('settings')">Настройки</div>
            </div>
            <div id="content"></div>
          `;
            const content = document.getElementById('content');
            if (state.tab === 'dashboard') content.innerHTML = renderDashboard(map);
            else if (state.tab === 'packages') content.innerHTML = state.viewingPackageId ? renderPackageDetail(state
                .viewingPackageId) : renderPackagesList(map);
            else if (state.tab === 'customers') content.innerHTML = renderCustomers(map);
            else if (state.tab === 'settings') content.innerHTML = renderSettings();

            if (state.editingPackageId) { content.innerHTML += renderPackageModal();
                attachPkgListeners(); }
            if (state.editingItemId) { content.innerHTML += renderItemModal();
                attachItemListeners(); }
            if (state.addingClientToPkgId) { content.innerHTML += renderAddClientModal(); }
            updateSaveStatus();
        }

        // ---- dashboard ----
        function renderDashboard(map) {
            const results = Object.values(map);
            const profit = results.reduce((s, r) => s + r.profit, 0);
            const debt = results.reduce((s, r) => s + r.debt, 0);
            const weight = results.reduce((s, r) => s + (Number(r.weight) || 0), 0);
            const base = results.reduce((s, r) => s + r.base, 0);
            const customerTotal = results.reduce((s, r) => s + r.customerTotal, 0);
            const avgMargin = base > 0 ? (profit / base * 100) : 0;
            const activePkgs = state.packages.filter(p => p.status !== PACKAGE_STATUSES[3]).length;
            const recentPkgs = [...state.packages].sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 5);
            return `
            <div class="stat-grid">
              <div class="stat profit"><div class="label">Прибыль по всем посылкам</div><div class="value">${cur()}${fmt(profit)}</div></div>
              <div class="stat"><div class="label">Должны клиенты</div><div class="value">${cur()}${fmt(debt)}</div></div>
              <div class="stat"><div class="label">Посылок всего / активных</div><div class="value">${state.packages.length} / ${activePkgs}</div></div>
              <div class="stat"><div class="label">Людей</div><div class="value">${state.customers.length}</div></div>
              <div class="stat"><div class="label">Средняя маржа</div><div class="value">${fmt(avgMargin)}%</div></div>
              <div class="stat"><div class="label">Общий вес</div><div class="value">${fmt(weight)} кг</div></div>
            </div>
            <div class="card">
              <div class="section-title">Доходы и расходы по месяцам</div>
              ${renderMonthlyChart(map)}
            </div>
            <div class="card">
              <div class="section-title">Доходы и расходы по посылкам</div>
              ${renderPackageChart(map)}
            </div>
            <div class="card">
              <div class="section-title">Последние посылки</div>
              ${recentPkgs.length === 0 ? '<div class="empty">Пока нет посылок. Добавьте первую на вкладке «Посылки».</div>' :
                recentPkgs.map(p => renderPackageRow(p, map)).join('')}
            </div>
          `;
        }

        // ---- charts ----
        function monthLabel(m) {
            const names = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
            const [y, mo] = m.split('-');
            const idx = parseInt(mo, 10) - 1;
            return (names[idx] || m) + ' ' + String(y).slice(2);
        }

        function monthlyAggregates(map) {
            const buckets = {};
            state.packageClients.forEach(c => {
                const pkg = state.packages.find(p => p.id === c.packageId);
                const month = (pkg && pkg.date ? pkg.date.slice(0, 7) : '') || '—';
                if (!buckets[month]) buckets[month] = { cost: 0, revenue: 0 };
                const r = map[c.id];
                if (!r) return;
                buckets[month].cost += r.base;
                buckets[month].revenue += r.customerTotal;
            });
            return Object.keys(buckets).sort().slice(-9).map(m => ({
                label: m === '—' ? 'без даты' : monthLabel(m),
                cost: buckets[m].cost,
                revenue: buckets[m].revenue
            }));
        }

        function renderMonthlyChart(map) {
            const data = monthlyAggregates(map);
            if (data.length === 0) return '<div class="empty">Пока нет данных для графика.</div>';
            return svgGroupedBarChart(data);
        }

        function renderPackageChart(map) {
            const data = [...state.packages].sort((a, b) => (a.date || '').localeCompare(b.date || '')).slice(-8).map(p => {
                const t = clientsForPackage(p.id).reduce((acc, c) => {
                    const r = map[c.id];
                    if (!r) return acc;
                    return { cost: acc.cost + r.base, revenue: acc.revenue + r.customerTotal };
                }, { cost: 0, revenue: 0 });
                return { label: p.name.length > 10 ? p.name.slice(0, 9) + '…' : p.name, cost: t.cost, revenue: t
                        .revenue };
            });
            if (data.length === 0) return '<div class="empty">Добавьте посылки с людьми, чтобы увидеть график.</div>';
            return svgGroupedBarChart(data);
        }

        function svgGroupedBarChart(items) {
            const width = 680,
                height = 260;
            const padding = { top: 14, right: 14, bottom: 44, left: 54 };
            const chartW = width - padding.left - padding.right;
            const chartH = height - padding.top - padding.bottom;
            const maxVal = Math.max(1, ...items.flatMap(i => [i.cost, i.revenue]));
            const niceMax = Math.ceil(maxVal / 5) * 5 || 1;
            const groupW = chartW / items.length;
            const barW = Math.max(6, Math.min(30, groupW * 0.28));
            let bars = '',
                labels = '',
                grid = '';
            for (let g = 0; g <= 4; g++) {
                const gy = padding.top + chartH - (chartH * g / 4);
                grid +=
                    `<line x1="${padding.left}" y1="${gy}" x2="${width - padding.right}" y2="${gy}" stroke="var(--line)" stroke-width="1" opacity="0.6"/>`;
                grid +=
                    `<text x="${padding.left - 8}" y="${gy + 3}" text-anchor="end" font-size="9.5" fill="var(--ink-soft)" font-family="IBM Plex Mono,monospace">${fmt(niceMax * g / 4)}</text>`;
            }
            items.forEach((it, idx) => {
                const gx = padding.left + idx * groupW + groupW / 2;
                const costH = (it.cost / niceMax) * chartH;
                const revH = (it.revenue / niceMax) * chartH;
                const costX = gx - barW - 2;
                const revX = gx + 2;
                bars +=
                    `<rect x="${costX}" y="${padding.top + chartH - costH}" width="${barW}" height="${Math.max(costH, 0)}" fill="var(--stamp)" opacity="0.82" rx="2"/>`;
                bars +=
                    `<rect x="${revX}" y="${padding.top + chartH - revH}" width="${barW}" height="${Math.max(revH, 0)}" fill="var(--profit)" opacity="0.82" rx="2"/>`;
                labels +=
                    `<text x="${gx}" y="${height - padding.bottom + 18}" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)" font-family="Inter,sans-serif">${escapeHtml(it.label)}</text>`;
            });
            const axis =
                `<line x1="${padding.left}" y1="${padding.top + chartH}" x2="${width - padding.right}" y2="${padding.top + chartH}" stroke="var(--ink)" stroke-width="1.2"/>`;
            return `
            <svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block;">
              ${grid}${axis}${bars}${labels}
            </svg>
            <div style="display:flex;gap:18px;margin-top:6px;font-size:12px;color:var(--ink-soft);">
              <span><span style="display:inline-block;width:10px;height:10px;background:var(--stamp);border-radius:2px;margin-right:5px;vertical-align:middle;"></span>Расходы</span>
              <span><span style="display:inline-block;width:10px;height:10px;background:var(--profit);border-radius:2px;margin-right:5px;vertical-align:middle;"></span>Доходы</span>
            </div>
          `;
        }

        // ---- packages list ----
        function renderPackagesList(map) {
            return `
            <div class="btn-row" style="margin-top:0;">
              <button onclick="openNewPackage()">+ Новая посылка</button>
            </div>
            ${state.packages.length === 0 ? '<div class="empty">Посылок пока нет. Создайте первую — потом добавите в неё товары и людей.</div>' :
              [...state.packages].sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(p => renderPackageRow(p, map)).join('')}
          `;
        }

        function renderPackageRow(p, map) {
            const pkgItems = itemsForPackage(p.id);
            const clients = clientsForPackage(p.id);
            const totals = clients.reduce((acc, c) => {
                const r = map[c.id];
                if (!r) return acc;
                return {
                    base: acc.base + r.base,
                    customerTotal: acc.customerTotal + r.customerTotal,
                    profit: acc.profit + r.profit,
                    weight: acc.weight + (Number(c.weight) || 0)
                };
            }, { base: 0, customerTotal: 0, profit: 0, weight: 0 });
            return `
            <div class="pkg-row" onclick="viewPackage('${p.id}')">
              <div class="top">
                <div>
                  <div class="name">${escapeHtml(p.name)}</div>
                  <div class="meta">${p.date} · ${pkgItems.length} товар(ов) · ${clients.length} человек · ${fmt(totals.weight)} кг</div>
                </div>
                <div style="display:flex;align-items:center;gap:10px;">
                  <span class="badge">${p.status}</span>
                </div>
              </div>
              <div class="nums" style="margin-top:10px;">
                <div><span class="num-label">Себестоимость</span>${cur()}${fmt(totals.base)}</div>
                <div><span class="num-label">Клиентам</span>${cur()}${fmt(totals.customerTotal)}</div>
                <div><span class="num-label">Прибыль</span><span class="profit-val">${cur()}${fmt(totals.profit)}</span></div>
              </div>
            </div>
          `;
        }

        // ---- package detail ----
        function renderPackageDetail(pkgId) {
            const pkg = state.packages.find(p => p.id === pkgId);
            if (!pkg) { state.viewingPackageId = null; return renderPackagesList(allGroupCalcs()); }
            const clients = clientsForPackage(pkgId);
            const items = itemsForPackage(pkgId);
            const { groups, totals } = calcPackage(pkg, clients, items, state.settings);
            return `
            <div class="back-link" onclick="setTab('packages')">← Все посылки</div>
            <div class="pkg-detail-header">
              <div>
                <h2>${escapeHtml(pkg.name)}</h2>
                <div class="hint" style="margin-top:6px;">${pkg.date} · <span class="badge" style="cursor:pointer" onclick="cyclePackageStatus('${pkg.id}')">${pkg.status}</span></div>
              </div>
              <div class="btn-row" style="margin-top:0;">
                <button class="secondary small" onclick="openEditPackage('${pkg.id}')">Параметры посылки</button>
                <button class="secondary small" onclick="exportPackageCsv('${pkg.id}')">Скачать CSV</button>
                <button class="danger small" onclick="deletePackage('${pkg.id}')">Удалить посылку</button>
              </div>
            </div>
            <div class="stat-grid">
              <div class="stat"><div class="label">Себестоимость</div><div class="value">${cur()}${fmt(totals.base)}</div></div>
              <div class="stat"><div class="label">Цена клиентам</div><div class="value">${cur()}${fmt(totals.customerTotal)}</div></div>
              <div class="stat profit"><div class="label">Прибыль</div><div class="value">${cur()}${fmt(totals.profit)}</div></div>
              <div class="stat"><div class="label">Долг клиентов</div><div class="value">${cur()}${fmt(totals.debt)}</div></div>
              <div class="stat"><div class="label">Вес</div><div class="value">${fmt(totals.weight)} кг</div></div>
            </div>
            ${pkg.notes ? `<div class="card hint">${escapeHtml(pkg.notes)}</div>` : ''}
            <div class="btn-row" style="margin-top:0;">
              <button onclick="openAddClient('${pkg.id}')">+ Добавить человека</button>
            </div>
            ${groups.length === 0 ? '<div class="empty">В посылке пока никого нет. Добавьте человека (или «Для себя»), затем впишите вес его части и товары.</div>' :
              groups.map(g => renderClientGroup(g, pkg)).join('')}
          `;
        }

        // ---- client group card ----
        function renderClientGroup(g, pkg) {
            const isPaid = g.debt <= 0 && g.customerTotal > 0;
            const isDeliveryPaid = (Number(g.client.deliveryPaidAmount) || 0) >= (g.deliveryCustomerShare - 0.001);
            const showDeliveryBtn = g.weight > 0;

            return `
            <div class="card" style="border-left:3px solid var(--gold);">
              <div class="top" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:flex-start;">
                <div>
                  <div class="who" style="font-size:16px;">${escapeHtml(custName(g.customerId))}</div>
                  <div class="hint">${g.items.length} товар(ов)</div>
                </div>
                <div class="row" style="grid-template-columns:auto auto;gap:10px;margin-top:0;">
                  <div><label style="margin-top:0;">Вес, кг</label><input type="number" class="mono-input" style="width:100px;" value="${g.client.weight}" oninput="updateClientField('${g.client.id}','weight',this.value); scheduleGroupRerender();"></div>
                  <div><label style="margin-top:0;">Получено за товары, ${cur()}</label><input type="number" class="mono-input" style="width:120px;" value="${g.client.paidAmount}" oninput="updateClientField('${g.client.id}','paidAmount',this.value); scheduleGroupRerender();"></div>
                </div>
              </div>
              <div class="nums" style="margin-top:12px;">
                <div><span class="num-label">Товары</span>${cur()}${fmt(g.itemCostSum)}</div>
                <div><span class="num-label">Доставка (реальная)</span>${cur()}${fmt(g.deliveryRealShare)}</div>
                <div><span class="num-label">Доставка (клиенту)</span>${cur()}${fmt(g.deliveryCustomerShare)}</div>
                <div><span class="num-label">Цена клиенту (всего)</span>${cur()}${fmt(g.customerTotal)}</div>
                <div><span class="num-label">Прибыль</span><span class="profit-val">${cur()}${fmt(g.profit)}</span></div>
              </div>

              <div class="debt-summary">
                <span class="debt-item"><span class="label">Долг за товары:</span>
                  <span class="val ${g.productDebt <= 0 ? 'debt-ok' : 'debt-bad'}">${cur()}${fmt(g.productDebt)}</span>
                </span>
                <span class="debt-item"><span class="label">Долг за доставку:</span>
                  <span class="val ${g.deliveryDebt <= 0 ? 'debt-ok' : 'debt-bad'}">${cur()}${fmt(g.deliveryDebt)}</span>
                </span>
                <span class="debt-item"><span class="label">Всего долг:</span>
                  <span class="val ${g.debt <= 0 ? 'debt-ok' : 'debt-bad'}">${cur()}${fmt(g.debt)}</span>
                </span>
              </div>

              <div class="actions">
                <span class="badge ${isPaid ? 'paid' : ''}" style="cursor:pointer" onclick="markClientPaidInFull('${g.client.id}')">
                  ${isPaid ? '✓ Всё оплачено' : 'Долг '+cur()+fmt(g.debt)}
                </span>
                ${showDeliveryBtn ? `
                  <button class="small ${isDeliveryPaid ? 'success paid' : 'delivery-debt-btn'}" onclick="toggleDeliveryPaid('${g.client.id}')">
                    ${isDeliveryPaid ? '✓ Доставка оплачена' : 'Долг доставки '+cur()+fmt(g.deliveryDebt)}
                  </button>
                ` : ''}
                <button class="secondary small" onclick="openNewItem('${pkg.id}','${g.customerId}')">+ Товар</button>
                <button class="danger small" onclick="deleteClient('${g.client.id}')">Убрать человека</button>
              </div>
              ${g.items.length > 0 ? `<div style="margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;">
                ${g.items.map(it => renderItemLine(it)).join('')}
              </div>` : ''}
            </div>
          `;
        }

        function renderItemLine(it) {
            return `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;gap:10px;flex-wrap:wrap;">
              <div style="min-width:0;">
                <span style="font-weight:500;">${escapeHtml(it.name)}</span>
                ${it.link ? ` · <a href="${escapeHtml(it.link)}" target="_blank" rel="noopener" style="color:var(--gold);font-size:12.5px;">ссылка ↗</a>` : ''}
                ${it.tracking ? `<span class="hint"> · трек: ${escapeHtml(it.tracking)}</span>` : ''}
              </div>
              <div style="display:flex;gap:12px;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:12.5px;white-space:nowrap;">
                <span>${cur()}${fmt(it.itemCost)} → ${cur()}${fmt(it.salePrice)}</span>
                <button class="secondary small" onclick="openEditItem('${it.id}')">✎</button>
                <button class="danger small" onclick="deleteItem('${it.id}')">✕</button>
              </div>
            </div>
          `;
        }

        function scheduleGroupRerender() {
            clearTimeout(window.__groupRerenderT);
            window.__groupRerenderT = setTimeout(() => { render(); }, 600);
        }

        // ---- add client modal ----
        function renderAddClientModal() {
            const opts = availableCustomersForPackage(state.addingClientToPkgId);
            return `
          <div class="modal-overlay">
            <div class="modal-box">
              <button class="modal-close-top" onclick="cancelAddClient()">✕</button>
              <div class="modal-title">Добавить человека в посылку</div>
              ${opts.length === 0 ? '<div class="modal-msg">Все люди уже добавлены в эту посылку. Сначала добавьте нового человека на вкладке «Люди».</div>' : `
                <div style="margin-top:8px;">
                  <label style="margin-top:0;">Кто</label>
                  <select id="addClientSelect">
                    ${opts.map(o => `<option value="${o.id}">${escapeHtml(o.name)}</option>`).join('')}

                  <button class="secondary" onclick="cancelAddClient()">Отмена</button>
                  <button class="success" onclick="confirmAddClient()">Добавить</button>
                </div>
              `}
            </div>
          </div>
        `;
        }

        // ---- customers ----
        function renderCustomers(map) {
            return `
            <div class="card">
              <div class="section-title">Добавить человека</div>
              <div class="row">
                <div><label>Имя</label><input id="newCustName" placeholder="Например, Аня"></div>
                <div><label>Контакт (телефон, ник)</label><input id="newCustContact" placeholder="Необязательно"></div>
              </div>
              <div class="btn-row"><button onclick="addCustomerFromInput()">Добавить</button></div>
            </div>
            ${state.customers.length === 0 ? '<div class="empty">Пока никого нет.</div>' :
              state.customers.map(c => {
                const custItems = state.items.filter(i => i.customerId === c.id);
                const custGroups = state.packageClients.filter(pc => pc.customerId === c.id);
                const tt = custGroups.reduce((acc, pc) => {
                  const r = map[pc.id];
                  if (!r) return acc;
                  return { profit: acc.profit + r.profit, debt: acc.debt + r.debt };
                }, { profit: 0, debt: 0 });
                return `
                <div class="cust-item">
                  <div>
                    <div class="name">${escapeHtml(c.name)}</div>
                    <div class="meta">${escapeHtml(c.contact || '')}</div>
                  </div>
                  <div class="cust-stats">
                    ${custItems.length} товар(ов)<br>
                    прибыль ${cur()}${fmt(tt.profit)} · долг ${cur()}${fmt(tt.debt)}
                  </div>
                  <button class="danger small" onclick="deleteCustomer('${c.id}')">Удалить</button>
                </div>`;
              }).join('')}
          `;
        }

        // ---- settings ----
        function renderSettings() {
            const s = state.settings;
            const showUsdRate = s.currency !== 'USD';
            return `
            <div class="card">
              <div class="section-title">Валюта и курсы</div>
              <div class="hint">Выберите валюту, в которой считаете прибыль и выставляете цену клиентам. Курсы юаня и доллара нужны, чтобы переводить закупочные цены.</div>
              <div class="row3">
                <div><label>Рабочая валюта</label>
                  <select onchange="updateSettingsFieldAndRender('currency', this.value)">
                    ${Object.keys(CURRENCIES).map(k => `<option value="${k}" ${s.currency === k ? 'selected' : ''}>${CURRENCIES[k].label} (${CURRENCIES[k].symbol})</option>`).join('')}
                  </select>
                </div>
                ${showUsdRate ? `<div><label>Курс $ (доллар) → ${cur()}</label><input type="number" class="mono-input" value="${s.usdRate}" oninput="updateSettingsField('usdRate', this.value)"></div>` : '<div></div>'}
                <div></div>
              </div>
              <div class="row" style="margin-top:4px;">
                <div>
                  <label>1. Реальный курс ¥ → ${cur()} (себестоимость)</label>
                  <input type="number" class="mono-input" value="${s.cnyRateReal}" oninput="updateSettingsField('cnyRateReal', this.value); updateCnyAutoHint();">
                  <div class="hint" id="cnyAutoHint">${cnyAutoHintHtml()}</div>
                </div>
                <div>
                  <label>2. Ваш курс ¥ → ${cur()} (цена клиенту)</label>
                  <input type="number" class="mono-input" value="${s.cnyRate}" oninput="updateSettingsField('cnyRate', this.value); updateCnyAutoHint();">
                  <div class="hint">По нему пересчитывается цена товара для клиента. Разница с реальным курсом — ваша прибыль на курсе.</div>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="section-title">Доставка — реальная цена и цена клиенту</div>
              <div class="hint">По аналогии с курсом валют: реальная цена за кг — сколько вы платите перевозчику, цена клиенту — сколько берёте с покупателей за доставку. Разница — ваша прибыль на доставке.</div>
              <div class="row">
                <div>
                  <label>1. Реальная цена доставки за кг, ${cur()}</label>
                  <input type="number" class="mono-input" value="${s.deliveryRateReal}" oninput="updateSettingsField('deliveryRateReal', this.value)">
                  <div class="hint">Сколько на самом деле стоит доставка 1 кг.</div>
                </div>
                <div>
                  <label>2. Цена доставки клиенту за кг, ${cur()}</label>
                  <input type="number" class="mono-input" value="${s.deliveryRateCustomer}" oninput="updateSettingsField('deliveryRateCustomer', this.value)">
                  <div class="hint">Сколько вы берёте с клиента за доставку 1 кг. Разница с реальной ценой — ваша прибыль.</div>
                </div>
              </div>
              <div class="hint" style="margin-top:10px;">
                <strong>Как это работает:</strong> для каждого человека в посылке доставка считается по его весу.
                В себестоимость идёт <strong>реальная цена</strong>, клиенту выставляется <strong>цена клиенту</strong>.
                Разница — ваша прибыль на доставке.
                Если вы знаете точную стоимость доставки всей посылки, её можно вписать вручную в параметрах посылки —
                она заменит расчёт по весу.
              </div>
            </div>

            <div class="card">
              <div class="section-title">Как считается прибыль</div>
              <div class="hint">
                <strong>Себестоимость</strong> = стоимость товаров (по реальному курсу валюты) + реальная цена доставки.<br>
                <strong>Цена клиенту</strong> = цена продажи товаров (по вашему курсу) + цена доставки клиенту.<br>
                <strong>Прибыль</strong> = цена клиенту − себестоимость.
              </div>
              <div class="hint" style="margin-top:8px;color:var(--ink);">
                Долг клиента делится на <strong>долг за товары</strong> и <strong>долг за доставку</strong> —
                вы можете отмечать их оплату отдельно кнопками «Долг» и «Долг доставки» в карточке человека.
              </div>
            </div>
          `;
        }

        // ---- package modal ----
        function renderPackageModal() {
            const p = state.packageDraft;
            const pkgClients = p.id ? clientsForPackage(p.id) : [];
            const pkgItems = p.id ? itemsForPackage(p.id) : [];
            const { totals } = calcPackage(p, pkgClients, pkgItems, state.settings);
            return `
          <div class="modal-overlay">
            <div class="modal-box" style="max-width:540px;">
              <button class="modal-close-top" onclick="cancelPackageEdit()">✕</button>
              <div class="modal-title">${state.editingPackageId === 'new' ? 'Новая посылка' : 'Параметры посылки'}</div>
              <div class="row">
                <div><label>Название</label><input id="pkg_name" value="${escapeHtml(p.name)}" placeholder="Например, СП «Лето» или Личная"></div>
                <div><label>Дата</label><input type="date" id="pkg_date" value="${p.date}"></div>
              </div>
              <div class="row3">
                <div><label>Доставка всей посылки, ${cur()} (необязательно)</label><input type="number" class="mono-input" id="pkg_deliveryTotal" value="${p.deliveryTotal}" placeholder="авто по весу"></div>
                <div><label>Статус</label>
                  <select id="pkg_status">${PACKAGE_STATUSES.map(s => `<option ${p.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
                </div>
                <div></div>
              </div>
              <div class="hint">
                Если поле «Доставка» оставить пустым, она посчитается автоматически по весу каждого человека
                (реальная цена и цена клиенту — из настроек).
                Впишите сумму сюда, если знаете точную стоимость доставки (например, по счёту перевозчика).
              </div>
              <label>Заметки</label>
              <textarea id="pkg_notes" rows="2">${escapeHtml(p.notes || '')}</textarea>
              <div class="breakdown" id="pkgBreakdownBox">${pkgBreakdownHtml(totals, pkgClients.length)}</div>
              <div class="modal-actions" style="margin-top:16px;">
                <button class="secondary" onclick="cancelPackageEdit()">Отмена</button>
                <button class="success" onclick="savePackage()">Сохранить</button>
              </div>
            </div>
          </div>
        `;
        }

        function attachPkgListeners() {
            const map = {
                pkg_name: 'name',
                pkg_date: 'date',
                pkg_deliveryTotal: 'deliveryTotal',
                pkg_status: 'status',
                pkg_notes: 'notes'
            };
            Object.keys(map).forEach(elId => {
                const el = document.getElementById(elId);
                if (!el) return;
                const evt = (el.tagName === 'SELECT' || el.type === 'date') ? 'change' : 'input';
                el.addEventListener(evt, () => { updatePkgDraft(map[elId], el.value); });
            });
        }

        // ---- item modal ----
        function renderItemModal() {
            const d = state.itemDraft;
            const currency = d.priceCurrency === 'own' ? cur() : (d.priceCurrency === 'CNY' ? '¥' : '$');
            const isOwn = d.priceCurrency === 'own';
            return `
          <div class="modal-overlay">
            <div class="modal-box" style="max-width:520px;">
              <button class="modal-close-top" onclick="cancelItemEdit()">✕</button>
              <div class="modal-title">${state.editingItemId === 'new' ? 'Новый товар' : 'Изменить товар'} · ${escapeHtml(custName(d.customerId))}</div>
              <label>Товар</label>
              <input id="it_name" value="${escapeHtml(d.name)}" placeholder="Например, кроссовки Nike, 2 пары">
              <label>Ссылка на товар (необязательно)</label>
              <input id="it_link" value="${escapeHtml(d.link || '')}" placeholder="https://...">
              <div class="row3">
                <div><label>Валюта цены</label>
                  <select id="it_priceCurrency">
                    <option value="own" ${d.priceCurrency === 'own' ? 'selected' : ''}>${cur()} (готовая цена)</option>
                    <option value="CNY" ${d.priceCurrency === 'CNY' ? 'selected' : ''}>¥ юань</option>
                    <option value="USD" ${d.priceCurrency === 'USD' ? 'selected' : ''}>$ доллар</option>
                  </select>
                </div>
                <div><label>${isOwn ? '—' : 'Цена в ' + currency}</label><input type="number" class="mono-input" id="it_priceForeign" value="${d.priceForeign}" ${isOwn ? 'disabled' : ''}></div>
                <div><label>Стоимость товара, ${cur()}</label><input type="number" class="mono-input" id="it_itemCost" value="${d.itemCost}"></div>
              </div>
              <div class="row">
                <div><label>Цена продажи клиенту, ${cur()}</label><input type="number" class="mono-input" id="it_salePrice" value="${d.salePrice}"></div>
                <div><label>Трек-номер (необязательно)</label><input id="it_tracking" value="${escapeHtml(d.tracking || '')}"></div>
              </div>
              <div class="breakdown" id="itemBreakdownBox">${itemBreakdownHtml(d)}</div>
              <div class="modal-actions" style="margin-top:16px;">
                <button class="secondary" onclick="cancelItemEdit()">Отмена</button>
                <button class="success" onclick="saveItem()">Сохранить товар</button>
              </div>
            </div>
          </div>
        `;
        }

        function attachItemListeners() {
            const map = {
                it_name: 'name',
                it_link: 'link',
                it_priceForeign: 'priceForeign',
                it_itemCost: 'itemCost',
                it_tracking: 'tracking',
                it_salePrice: 'salePrice'
            };
            Object.keys(map).forEach(elId => {
                const el = document.getElementById(elId);
                if (!el) return;
                const evt = (el.tagName === 'SELECT' || el.type === 'date') ? 'change' : 'input';
                el.addEventListener(evt, () => { updateItemDraft(map[elId], el.value); });
            });
            const curEl = document.getElementById('it_priceCurrency');
            if (curEl) {
                curEl.addEventListener('change', () => {
                    state.itemDraft.priceCurrency = curEl.value;
                    render();
                });
            }
            const foreignEl = document.getElementById('it_priceForeign');
            if (foreignEl) { foreignEl.addEventListener('input', convertForeignPrice); }
        }

        // ---- escape ----
        function escapeHtml(str) {
            if (str === undefined || str === null) return '';
            return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
                "'": '&#39;' } [s]));
        }

        // ============================================================
        //  Start
        // ============================================================
        init();
    </script>
</body>
</html>
